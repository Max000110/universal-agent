[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-agent"
version = "1.0.0"
description = "Flagship local-first agentic CLI framework for Ubuntu and Termux with session cookie login for ChatGPT and Gemini"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "cryptography>=41.0.0",
]

[project.scripts]
universal-agent = "antigravity_cli.cli:app"
uag = "antigravity_cli.cli:app"
antigravity = "antigravity_cli.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = ["src"]
